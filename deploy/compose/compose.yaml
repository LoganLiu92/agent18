name: ${AGENT18_STACK_NAME:-agent18}
x-app: &app
  image: agent18:0.7.0-local
  pull_policy: never
  user: '${AGENT18_UID:-1000}:${AGENT18_GID:-1000}'
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  networks: [core]
services:
  postgres:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: agent18
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${AGENT18_LOCAL_DIR}/postgres-password:/run/secrets/postgres-password:ro
    ports: ['127.0.0.1:54328:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d agent18']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [core, host-access]
  opa:
    labels: { org.agent18.policy-version: '0.7.0' }
    image: openpolicyagent/opa:1.20.2-static@sha256:bb245e9e36be0d0ed486c240b606c56be7aba96014a4a87895fed4ba7a6dfa8d
    command: [run, --server, --addr=0.0.0.0:8181, --log-level=error, /policy/gateway.rego]
    volumes: ['../../packages/policy/rego/gateway.rego:/policy/gateway.rego:ro']
    ports: ['127.0.0.1:8188:8181']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [core, host-access]
  migrate:
    <<: *app
    restart: 'no'
    command: [node, --import, tsx, scripts/migrate.ts]
    environment: { AGENT18_MIGRATION_CONFIG: /run/config/migration.json }
    volumes: ['${AGENT18_LOCAL_DIR}/migration.docker.json:/run/config/migration.json:ro']
    depends_on:
      postgres: { condition: service_healthy }
  server:
    <<: *app
    networks: [core, host-access]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    environment: { AGENT18_CONFIG: /run/config/server.json }
    env_file:
      - path: ${AGENT18_LOCAL_DIR}/model.env
        required: false
      - path: ${AGENT18_LOCAL_DIR}/observability.env
        required: false
    volumes: ['${AGENT18_LOCAL_DIR}/server.docker.json:/run/config/server.json:ro']
    ports: ['127.0.0.1:4318:4318']
    depends_on:
      migrate: { condition: service_completed_successfully }
      opa: { condition: service_started }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4318/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *app
    command: [node, --import, tsx, apps/worker/src/main.ts]
    environment: { AGENT18_WORKER_CONFIG: /run/config/worker.json }
    volumes: ['${AGENT18_LOCAL_DIR}/worker.docker.json:/run/config/worker.json:ro']
    depends_on:
      server: { condition: service_healthy }
  identity-demo:
    <<: *app
    profiles: [demo]
    command: [node, --import, tsx, examples/identity-bridge/server.ts]
    environment:
      {
        AGENT18_IDENTITY_CONFIG: /run/config/identity.json,
        AGENT18_DEMO_BUSINESS_DB: /data/preferences.sqlite,
        AGENT18_DEMO_LOKI_URL: 'http://loki:3100',
      }
    volumes:
      - ${AGENT18_LOCAL_DIR}/identity.json:/run/config/identity.json:ro
      - ${AGENT18_LOCAL_DIR}/business-data:/data
    ports: ['127.0.0.1:4319:4319']
    networks: [demo, core]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4319/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  loki:
    profiles: [observability]
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    command: [-config.file=/etc/loki/agent18.yaml]
    volumes: ['../observability/loki.yaml:/etc/loki/agent18.yaml:ro', 'loki-data:/loki']
    ports: ['127.0.0.1:31310:3100']
    restart: unless-stopped
    networks: [core, host-access]
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command: [--config.file=/etc/prometheus/agent18.yaml, --storage.tsdb.retention.time=7d]
    volumes:
      ['../observability/prometheus.yaml:/etc/prometheus/agent18.yaml:ro', 'prometheus-data:/prometheus']
    ports: ['127.0.0.1:39090:9090']
    restart: unless-stopped
    networks: [core, host-access]
volumes:
  postgres-data:
  loki-data:
  prometheus-data:
networks:
  core:
    internal: true
  demo:
  host-access:
