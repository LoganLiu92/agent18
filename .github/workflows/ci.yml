name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm check
      - run: pnpm run setup && pnpm demo:start
      - run: pnpm test:policy && pnpm test:integration && pnpm test:recovery && pnpm test:journey
      - uses: actions/upload-artifact@v4
        with:
          name: agent18-sdk-api-and-acceptance
          path: .local/release/
      - if: failure()
        run: pnpm logs
      - if: always()
        run: pnpm demo:stop
